appId: com.wenxianghong.little-things-archive
productName: "人间小事档案馆"
copyright: "Copyright © 2026"
directories:
  output: release
  buildResources: build
files:
  - dist
  - dist-electron
  - docs/index.html
  - docs/supabase.min.js
mac:
  category: public.app-category.lifestyle
  target:
    - dmg
  artifactName: "人间小事档案馆-${version}.${ext}"
  icon: build/icon.png
dmg:
  title: "人间小事档案馆"
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
win:
  target:
    - nsis
nsis:
  artifactName: "人间小事档案馆-Setup-${version}.${ext}"
linux:
  target:
    - AppImage
  artifactName: "人间小事档案馆-${version}.${ext}"
