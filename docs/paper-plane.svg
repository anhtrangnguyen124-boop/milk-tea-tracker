<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 67 72" width="67" height="72">
  <defs>
    <!-- Shadow gradient for 3D airplane body -->
    <linearGradient id="planeBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5F5F0"/>
      <stop offset="25%" stop-color="#FCFCF8"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="75%" stop-color="#F2F2EC"/>
      <stop offset="100%" stop-color="#E8E8E0"/>
    </linearGradient>
    <!-- Fold shadow -->
    <linearGradient id="foldShadow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(0,0,0,0.06)"/>
      <stop offset="50%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.04)"/>
    </linearGradient>
    <!-- Drop shadow -->
    <filter id="planeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Main body with shadow -->
  <g filter="url(#planeShadow)">
    <!-- Top wing -->
    <path d="M66,8
             C62,8 58,9 54,10
             C50,11 46,12 42,13
             C38,14 34,16 30,18
             C26,20 22,23 18,27
             C16,29 14,30 13,32
             C11,34 9,35 8,35
             C9,33 10,31 12,29
             C14,27 17,25 20,23
             C24,20 28,18 32,17
             C36,16 40,15 44,14
             C48,13 52,13 56,14
             C60,15 63,18 65,22
             C66,24 66,26 66,28
             Z"
          fill="url(#planeBody)" stroke="rgba(0,0,0,0.08)" stroke-width="0.5"/>

    <!-- Bottom wing -->
    <path d="M8,35
             C9,37 10,38 11,39
             C12,40 14,42 16,43
             C20,45 24,47 28,48
             C32,49 36,50 40,51
             C44,52 48,52 52,54
             C56,56 59,59 62,63
             C63,65 65,67 66,68
             C66,66 65,63 63,60
             C60,56 57,53 54,50
             C50,47 46,45 42,44
             C38,43 34,42 30,42
             C26,42 22,43 18,44
             C16,44 14,45 12,46
             C11,46 9,47 8,46
             C8,43 8,39 8,35
             Z"
          fill="url(#planeBody)" stroke="rgba(0,0,0,0.08)" stroke-width="0.5"/>
  </g>

  <!-- Center fold line -->
  <line x1="9" y1="35" x2="62" y2="40"
        stroke="rgba(0,0,0,0.12)" stroke-width="0.8"
        stroke-dasharray="3,2"/>

  <!-- Wing crease top -->
  <path d="M18,27 C22,24 28,20 36,20 C46,20 54,23 58,29"
        fill="none" stroke="rgba(0,0,0,0.06)" stroke-width="0.6"/>

  <!-- Wing crease bottom -->
  <path d="M16,43 C22,45 30,47 38,50 C46,53 54,55 60,59"
        fill="none" stroke="rgba(0,0,0,0.06)" stroke-width="0.6"/>

  <!-- Nose highlight -->
  <path d="M66,8 C64,8 62,9 60,11 C58,13 56,16 54,20"
        fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="1"/>

  <!-- Tail fold notch indicator -->
  <path d="M8,35 L12,33 L16,32"
        fill="none" stroke="rgba(0,0,0,0.15)" stroke-width="0.7"/>
</svg>